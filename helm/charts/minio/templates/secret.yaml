apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-minio
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  rootUser: {{ .Values.auth.rootUser | b64enc }}
  rootPassword: {{ .Values.auth.rootPassword | b64enc }}
