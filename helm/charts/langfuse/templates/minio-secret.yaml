apiVersion: v1
kind: Secret
metadata:
  name: langfuse-minio-creds
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: langfuse
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
type: Opaque
data:
  accessKeyId: {{ .Values.minio.rootUser | b64enc }}
  secretAccessKey: {{ .Values.minio.rootPassword | b64enc }}
