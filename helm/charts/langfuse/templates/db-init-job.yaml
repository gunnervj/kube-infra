apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-db-init
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: langfuse
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: db-init
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langfuse
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: db-init
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: postgres:16
          command:
            - sh
            - -c
            - |
              psql -h "$PGHOST" -U "$PGUSER" -d postgres -tc \
                "SELECT 1 FROM pg_database WHERE datname = 'langfuse'" \
                | grep -q 1 || psql -h "$PGHOST" -U "$PGUSER" -d postgres \
                -c "CREATE DATABASE langfuse"
          env:
            - name: PGHOST
              value: {{ .Values.postgres.host | quote }}
            - name: PGPORT
              value: {{ .Values.postgres.port | quote }}
            - name: PGUSER
              value: {{ .Values.postgres.username | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-postgres-creds
                  key: password
