apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-setup
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "10"
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: keycloak-setup
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: keycloak-setup
          image: curlimages/curl:8.5.0
          command:
            - sh
            - /scripts/setup.sh
          env:
            - name: FRONTEND_URL
              value: {{ .Values.frontendUrl | quote }}
            - name: KEYCLOAK_ADMIN_USER
              value: {{ .Values.adminUser | quote }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-secret
                  key: admin-password
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: keycloak-setup-script
            defaultMode: 0755
